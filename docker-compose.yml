services:
  crunchyroller:
    build: .
    image: crunchyroller:local
    container_name: crunchyroller
    restart: unless-stopped
    # Run as the host user that owns ./data and the downloads folder.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Hostnames allowed to call the API besides localhost: LAN IP and/or Traefik domain.
      CRUNCHYROLLER_ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - ./data:/data                               # config.json, state, logs, your .wvd
      - ${DOWNLOAD_DIR:-./downloads}:/downloads    # set "/downloads" as download folder in settings
    ports:
      - "8000:8000"   # direct LAN access; remove if you only go through Traefik
    # --- Traefik (uncomment, and keep basic auth: the web UI has no login of its own) ---
